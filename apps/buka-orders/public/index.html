<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buka Orders (sample)</title>
<style>
  :root { --ink:#8B1419; --text:#17130F; --paper:#FAF6EE; }
  body { font: 22px/1.5 system-ui, sans-serif; background: var(--paper); color: var(--text); max-width: 860px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 40px; margin: 0 0 4px; } .tag { background: var(--ink); color: #fff; font-size: 14px; padding: 2px 10px; border-radius: 99px; vertical-align: middle; }
  input, button { font: inherit; padding: 8px 12px; margin: 4px 0; } button { background: var(--ink); color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 14px 18px; margin: 12px 0; }
  pre { background: #17130F; color: #EFE7D6; padding: 16px; border-radius: 8px; font-size: 20px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Buka Orders <span class="tag">SAMPLE APP</span></h1>
<p>Fictional data. Runs on this laptop only.</p>
<div id="login" class="card">
  <input id="email" placeholder="email" value="ada@sample.test"> <input id="password" type="password" placeholder="password" value="ada-demo">
  <button onclick="login()">Sign in</button>
  <div style="font-size:16px;color:#666">Sample accounts: ada@sample.test / ada-demo, bayo@sample.test / bayo-demo</div>
</div>
<div id="app"></div>
<script>
async function login() {
  const r = await fetch("/api/login", { method: "POST", body: JSON.stringify({ email: email.value, password: password.value }) });
  if (!r.ok) return alert("Sign-in failed");
  load();
}
async function load() {
  const me = await fetch("/api/me");
  if (!me.ok) return;
  const user = await me.json();
  const list = await (await fetch("/api/orders")).json();
  app.innerHTML = `<h2>Hello ${user.name}</h2>` + list.map((o) => `
    <div class="card"><b>Order ${o.id}</b>: ${o.items}, N${o.total}
      <a href="/api/orders/${o.id}" target="_blank">details</a>
      ${user.role === "admin" ? `<button onclick="refund('${o.id}')">Refund</button>` : ""}
    </div>`).join("");
}
async function refund(id) { await fetch("/api/refund", { method: "POST", body: JSON.stringify({ orderId: id }) }); load(); }
load();
</script>
</body>
</html>
